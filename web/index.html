<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@1,400&display=swap" />
    <title>RAG X-Ray</title>
  </head>
  <body>
    <script>
      // Before first paint: a stored dark theme must not flash white first.
      try {
        var t = localStorage.getItem('ragdemo.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var z = Number(localStorage.getItem('ragdemo.zoom'));
        if (z >= 0.8 && z <= 1.6) document.documentElement.style.setProperty('--ui-zoom', String(z));
      } catch (e) { /* private mode: the defaults are fine */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
