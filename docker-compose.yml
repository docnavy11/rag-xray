services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ragdemo-db
    environment:
      POSTGRES_USER: ragdemo
      POSTGRES_PASSWORD: ragdemo
      POSTGRES_DB: ragdemo
    ports: ["127.0.0.1:5444:5432", "[::1]:5444:5432", "100.121.192.61:5444:5432"]
    volumes: ["ragdemo-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdemo"]
      interval: 5s
      retries: 12

volumes:
  ragdemo-pg:
